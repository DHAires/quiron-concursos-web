<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- Decorative Stars -->
  <g fill="#93c5fd" opacity="0.3">
    <path d="M100,100 L105,105 L100,110 L95,105 Z"/>
    <path d="M420,120 L425,125 L420,130 L415,125 Z"/>
    <path d="M380,400 L385,405 L380,410 L375,405 Z"/>
    <path d="M120,380 L125,385 L120,390 L115,385 Z"/>
  </g>
  
  <!-- Main Icon Group -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    
    <!-- Centaur Body (Horse part) -->
    <ellipse cx="0" cy="80" rx="70" ry="50" fill="#ffffff" opacity="0.95"/>
    <path d="M-60,60 Q-70,80 -65,100 L-55,110 L-45,105 L-50,80 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M60,60 Q70,80 65,100 L55,110 L45,105 L50,80 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Human Torso -->
    <path d="M-40,20 Q-45,-10 -35,-40 L-30,-60 Q-20,-70 0,-70 Q20,-70 30,-60 L35,-40 Q45,-10 40,20 L40,50 L-40,50 Z" 
          fill="#ffffff"/>
    
    <!-- Head -->
    <circle cx="0" cy="-80" r="35" fill="#ffffff"/>
    
    <!-- Facial Features -->
    <ellipse cx="-12" cy="-85" rx="4" ry="6" fill="#1e3a8a"/>
    <ellipse cx="12" cy="-85" rx="4" ry="6" fill="#1e3a8a"/>
    <path d="M-10,-70 Q0,-65 10,-70" stroke="#1e3a8a" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Beard (wise centaur) -->
    <path d="M-15,-60 Q0,-50 15,-60 L12,-45 Q0,-40 -12,-45 Z" fill="#60a5fa" opacity="0.7"/>
    
    <!-- Crown/Headband (teacher symbol) -->
    <ellipse cx="0" cy="-95" rx="25" ry="8" fill="url(#goldGradient)"/>
    <path d="M-20,-95 L-15,-110 L-10,-95 L-5,-110 L0,-95 L5,-110 L10,-95 L15,-110 L20,-95" 
          stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
    
    <!-- Bow (knowledge and precision) -->
    <path d="M50,-30 Q75,-40 85,-25 Q90,-10 80,0" 
          stroke="url(#goldGradient)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <line x1="52" y1="-30" x2="78" y2="0" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Arrow -->
    <g>
      <line x1="85" y1="-12" x2="115" y2="-12" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round"/>
      <path d="M115,-12 L105,-8 M115,-12 L105,-16" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round"/>
      <path d="M85,-12 L90,-10 L90,-14 Z" fill="url(#goldGradient)"/>
    </g>
    
    <!-- Book (education symbol) -->
    <g transform="translate(-75, 0)">
      <rect x="-25" y="-20" width="35" height="45" rx="2" fill="url(#goldGradient)"/>
      <rect x="-23" y="-18" width="31" height="41" rx="1" fill="#fef3c7"/>
      <line x1="-8" y1="-18" x2="-8" y2="23" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="-18" y1="-8" x2="2" y2="-8" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
      <line x1="-18" y1="-2" x2="2" y2="-2" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
      <line x1="-18" y1="4" x2="2" y2="4" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
    </g>
    
    <!-- Lightning Bolt (energy/power) -->
    <g transform="translate(75, 30)">
      <path d="M0,-25 L-8,0 L0,0 L-5,25 L10,-5 L2,-5 L8,-25 Z" fill="url(#goldGradient)"/>
    </g>
    
    <!-- Star of Excellence (top) -->
    <g transform="translate(0, -125)">
      <path d="M0,-15 L4,-5 L15,-5 L6,2 L10,12 L0,6 L-10,12 L-6,2 L-15,-5 L-4,-5 Z" 
            fill="url(#goldGradient)"/>
    </g>
  </g>
  
  <!-- Bottom Text Arc -->
  <path id="textPath" d="M 100,450 Q 256,480 412,450" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" opacity="0.9">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      QUIRON
    </textPath>
  </text>
</svg>
