<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgFeature" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fde047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Filters -->
    <filter id="featureShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgFeature)"/>
  
  <!-- Decorative Stars Pattern -->
  <g fill="#93c5fd" opacity="0.2">
    <circle cx="80" cy="80" r="3"/>
    <circle cx="950" cy="100" r="4"/>
    <circle cx="200" cy="450" r="2"/>
    <circle cx="900" cy="420" r="3"/>
    <circle cx="150" cy="250" r="2"/>
    <circle cx="970" cy="280" r="2"/>
  </g>
  
  <!-- Left: Centaur Quiron Illustration -->
  <g transform="translate(180, 250)" filter="url(#featureShadow)">
    <!-- Centaur Body -->
    <ellipse cx="0" cy="60" rx="55" ry="40" fill="#ffffff" opacity="0.95"/>
    <path d="M-45,45 Q-50,60 -48,75 L-42,82 L-36,78 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M45,45 Q50,60 48,75 L42,82 L36,78 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Torso -->
    <path d="M-30,15 Q-35,-5 -28,-25 L-24,-40 Q-18,-48 0,-48 Q18,-48 24,-40 L28,-25 Q35,-5 30,15 L30,38 L-30,38 Z" 
          fill="#ffffff"/>
    
    <!-- Head -->
    <circle cx="0" cy="-60" r="28" fill="#ffffff"/>
    <ellipse cx="-9" cy="-63" rx="3" ry="4" fill="#1e3a8a"/>
    <ellipse cx="9" cy="-63" rx="3" ry="4" fill="#1e3a8a"/>
    <path d="M-8,-52 Q0,-48 8,-52" stroke="#1e3a8a" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Beard -->
    <path d="M-12,-45 Q0,-38 12,-45 L10,-35 Q0,-30 -10,-35 Z" fill="#60a5fa" opacity="0.7"/>
    
    <!-- Crown -->
    <ellipse cx="0" cy="-73" rx="20" ry="6" fill="url(#goldShine)"/>
    
    <!-- Bow -->
    <path d="M38,-22 Q55,-28 62,-18 Q65,-8 58,0" 
          stroke="url(#goldShine)" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Book -->
    <g transform="translate(-55, 0)">
      <rect x="-18" y="-15" width="25" height="32" rx="1.5" fill="url(#goldShine)"/>
      <rect x="-16" y="-13" width="21" height="28" rx="1" fill="#fef3c7"/>
      <line x1="-6" y1="-13" x2="-6" y2="15" stroke="#f59e0b" stroke-width="1.2"/>
    </g>
    
    <!-- Glow effect -->
    <circle cx="0" cy="-20" r="80" fill="url(#glow)"/>
  </g>
  
  <!-- Right: Text Content -->
  <g transform="translate(400, 130)">
    <!-- Title: QUIRON -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="95" font-weight="bold" fill="#ffffff" letter-spacing="4">
      QUIRON
    </text>
    
    <!-- Subtitle: CONCURSOS -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="68" font-weight="600" fill="url(#goldShine)" letter-spacing="8">
      CONCURSOS
    </text>
    
    <!-- Tagline -->
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#bfdbfe" letter-spacing="1">
      Seu mentor rumo à aprovação
    </text>
    
    <!-- Features Icons + Text -->
    <g transform="translate(0, 180)">
      <!-- Feature 1: Game 3D -->
      <g>
        <circle cx="20" cy="0" r="16" fill="#60a5fa" opacity="0.2"/>
        <text x="20" y="6" font-size="22" text-anchor="middle">🎮</text>
        <text x="50" y="8" font-family="Arial, sans-serif" font-size="20" fill="#e2e8f0" font-weight="500">
          Game 3D Quiz Épico
        </text>
      </g>
      
      <!-- Feature 2: IA -->
      <g transform="translate(0, 50)">
        <circle cx="20" cy="0" r="16" fill="#a78bfa" opacity="0.2"/>
        <text x="20" y="6" font-size="22" text-anchor="middle">🤖</text>
        <text x="50" y="8" font-family="Arial, sans-serif" font-size="20" fill="#e2e8f0" font-weight="500">
          IA Prometheus
        </text>
      </g>
      
      <!-- Feature 3: Questões -->
      <g transform="translate(330, 0)">
        <circle cx="20" cy="0" r="16" fill="#fbbf24" opacity="0.2"/>
        <text x="20" y="6" font-size="22" text-anchor="middle">📚</text>
        <text x="50" y="8" font-family="Arial, sans-serif" font-size="20" fill="#e2e8f0" font-weight="500">
          Banco de Questões
        </text>
      </g>
      
      <!-- Feature 4: Gamificação -->
      <g transform="translate(330, 50)">
        <circle cx="20" cy="0" r="16" fill="#ec4899" opacity="0.2"/>
        <text x="20" y="6" font-size="22" text-anchor="middle">⚡</text>
        <text x="50" y="8" font-family="Arial, sans-serif" font-size="20" fill="#e2e8f0" font-weight="500">
          Sistema Freemium
        </text>
      </g>
    </g>
  </g>
  
  <!-- Bottom Badge -->
  <g transform="translate(512, 460)">
    <rect x="-180" y="-25" width="360" height="50" rx="25" fill="#1e3a8a" opacity="0.8"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="600" 
          fill="url(#goldShine)" text-anchor="middle" letter-spacing="2">
      4 ÁREAS • MITOLOGIA • GAMIFICAÇÃO
    </text>
  </g>
  
  <!-- Top right corner badge -->
  <g transform="translate(920, 60)">
    <circle cx="0" cy="0" r="45" fill="#fbbf24" opacity="0.9"/>
    <text x="0" y="-8" font-family="Arial, sans-serif" font-size="22" font-weight="bold" 
          fill="#1e3a8a" text-anchor="middle">
      100%
    </text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="14" font-weight="600" 
          fill="#1e3a8a" text-anchor="middle">
      GRÁTIS
    </text>
  </g>
</svg>
