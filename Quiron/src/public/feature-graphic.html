<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiron Concursos - Feature Graphic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .feature-graphic {
            width: 1024px;
            height: 500px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 25%, #FF4500 50%, #FFD700 100%);
        }
        
        /* Background Pattern */
        .pattern {
            position: absolute;
            inset: 0;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,.05) 10px, rgba(255,255,255,.05) 20px),
                repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(0,0,0,.1) 10px, rgba(0,0,0,.1) 20px);
        }
        
        /* Mythological Elements */
        .greek-border {
            position: absolute;
            inset: 20px;
            border: 4px solid #FFD700;
            border-image: repeating-linear-gradient(
                45deg,
                #FFD700,
                #FFD700 10px,
                #FFA500 10px,
                #FFA500 20px
            ) 1;
        }
        
        /* Content Container */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 80px;
        }
        
        /* Logo Area */
        .logo-area {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 20px;
        }
        
        .centaur-icon {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #FFD700, #FFA500);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.6);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .title-area {
            flex: 1;
        }
        
        .app-name {
            font-size: 72px;
            font-weight: 900;
            color: #FFFFFF;
            text-shadow: 
                4px 4px 0 #000,
                -1px -1px 0 #FFD700,
                1px -1px 0 #FFD700,
                -1px 1px 0 #FFD700,
                1px 1px 0 #FFD700,
                0 0 30px rgba(255, 215, 0, 0.8);
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 28px;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        /* Features */
        .features {
            display: flex;
            gap: 30px;
            margin-top: 30px;
        }
        
        .feature-badge {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 30px;
            border: 2px solid #FFD700;
            color: #FFFFFF;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .badge-icon {
            font-size: 24px;
        }
        
        /* Decorative Elements */
        .flame {
            position: absolute;
            font-size: 60px;
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }
        
        .flame-1 { top: 50px; right: 100px; animation-delay: 0s; }
        .flame-2 { bottom: 50px; right: 200px; animation-delay: 1s; }
        .flame-3 { top: 150px; right: 50px; animation-delay: 2s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        /* Shine Effect */
        .shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 0%,
                transparent 40%,
                rgba(255, 255, 255, 0.1) 45%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0.1) 55%,
                transparent 60%,
                transparent 100%
            );
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
    </style>
</head>
<body>
    <div class="feature-graphic">
        <!-- Background Pattern -->
        <div class="pattern"></div>
        
        <!-- Greek Border -->
        <div class="greek-border"></div>
        
        <!-- Shine Effect -->
        <div class="shine"></div>
        
        <!-- Decorative Flames -->
        <div class="flame flame-1">🔥</div>
        <div class="flame flame-2">🔥</div>
        <div class="flame flame-3">🔥</div>
        
        <!-- Main Content -->
        <div class="content">
            <div class="logo-area">
                <div class="centaur-icon">🏛️</div>
                <div class="title-area">
                    <div class="app-name">QUIRON</div>
                    <div class="subtitle">CONCURSOS PÚBLICOS</div>
                </div>
            </div>
            
            <div class="features">
                <div class="feature-badge">
                    <span class="badge-icon">🎮</span>
                    <span>GAME ÉPICO 3D</span>
                </div>
                <div class="feature-badge">
                    <span class="badge-icon">🤖</span>
                    <span>IA PROMETHEUS</span>
                </div>
                <div class="feature-badge">
                    <span class="badge-icon">📚</span>
                    <span>1000+ QUESTÕES</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Instruções para captura
        console.log(`

        `);
    </script>
</body>
</html>
